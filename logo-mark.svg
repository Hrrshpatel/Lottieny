  <!-- Tilted L shape (vertical + horizontal bar) -->
  <g transform="rotate(20 50 50)">
    <rect x="44" y="8" width="14" height="48" rx="2"/>
    <rect x="44" y="52" width="30" height="14" rx="2"/>
  </g>
  <!-- Square (left) -->
  <rect x="14" y="34" width="16" height="16" rx="2"/>
  <!-- Circle (right of L) -->
  <circle cx="67" cy="34" r="9"/>
</svg>
